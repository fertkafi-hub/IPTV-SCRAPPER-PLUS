name: Verify source url

on:
  push:
    paths:
      - .github/workflows/verify-source-url.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python .github/patch_source_url.py
      - name: Install
        run: python -m pip install -e .
      - name: Check CLI
        run: |
          python -m py_compile iptv_scraper/cli.py
          iptv-scraper --help | grep -q -- '--source-url'
          iptv-scraper --version
      - name: Test HLS page extraction
        run: |
          mkdir -p /tmp/iptv-test
          printf '%s\n' '<html><head><title>Test Channel</title></head><body><video><source src="/live.m3u8"></video></body></html>' > /tmp/iptv-test/index.html
          printf '%s\n' '#EXTM3U' '#EXT-X-VERSION:3' '#EXT-X-TARGETDURATION:5' '#EXT-X-MEDIA-SEQUENCE:1' '#EXTINF:5.0,' 'segment.ts' > /tmp/iptv-test/live.m3u8
          python -c "from pathlib import Path; Path('/tmp/iptv-test/segment.ts').write_bytes(b'\\x47' + b'video-data' * 2048)"
          python -m http.server 8765 --directory /tmp/iptv-test >/tmp/iptv-http.log 2>&1 &
          sleep 1
          python -c "from iptv_scraper.cli import IPTVScraper; s=IPTVScraper(); f=s.scrape_source_urls(['http://127.0.0.1:8765/index.html'], num_links=1, channel_name='Test Channel'); assert f == 1, f; assert s.scraped_links[0]['url'] == 'http://127.0.0.1:8765/live.m3u8'; print('END_TO_END_SOURCE_URL_OK')"
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/verify-source-url.yml .github/patch_source_url.py
          git add -A
          git commit -m 'Fix and verify source-url HLS validation'
          git push
